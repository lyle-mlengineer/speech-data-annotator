<!DOCTYPE html>
   <html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <!--=============== REMIXICONS ===============-->
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.css">

      <!-- Font Awesome -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
        />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />

      <!--=============== CSS ===============-->
      <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">

      {% block styles %}{% endblock %}

      <title>{{ title }}</title>
   </head>
   <body>
      <!--=============== HEADER ===============-->
      <header class="header" id="header">
         <div class="header__container">
            <a href="/" class="header__logo">
               <i class="ri-home-8-fill"></i>
               <span>Home</span>
            </a>
            
            <button class="header__toggle" id="header-toggle">
               <i class="ri-menu-line"></i>
            </button>
         </div>
      </header>

      <!--=============== SIDEBAR ===============-->
      <nav class="sidebar" id="sidebar">
         <div class="sidebar__container">
            <div class="sidebar__user">
               <div class="sidebar__img">
                  <img src="{{ url_for('static', path='img/perfil.png') }}" alt="image">
               </div>
   
               <div class="sidebar__info">
                  <h3>Anonymous</h3>
                  <span>anonymous@email.com</span>
               </div>
            </div>

            <div class="sidebar__content">
               <div>
                  <h3 class="sidebar__title" id="{{ audio_id }}">TASKS</h3>

                  <div class="sidebar__list">

                     <a href="/speech_to_text" class="sidebar__link {% if current_page == 'stt' %} active-link {% endif %}">
                        <i class="ri-voice-recognition-fill"></i>
                        <span>Transcription</span>
                     </a>

                     <a href="/audio" class="sidebar__link {% if current_page == 'audio' %} active-link {% endif %}">
                        <i class="ri-voice-recognition-fill"></i>
                        <span>Submission</span>
                     </a>
                     
                  </div>
               </div>

               <div>
                  <h3 class="sidebar__title">PROFILE</h3>

                  <div class="sidebar__list">
                     <a href="/dashboard" class="sidebar__link {% if current_page == 'dashboard' %} active-link {% endif %}">
                        <i class="ri-dashboard-fill"></i>
                        <span>Dashboard</span>
                     </a>
                     <a href="/profile" class="sidebar__link {% if current_page == 'profile' %} active-link {% endif %}">
                        <i class="ri-account-pin-box-fill"></i>
                        <span>User</span>
                     </a>

                     <a href="/notifications" class="sidebar__link {% if current_page == 'notifications' %} active-link {% endif %}">
                        <i class="ri-notification-2-fill"></i>
                        <span>Notifications</span>
                     </a>
                     
                  </div>
               </div>

               <div>
                  <h3 class="sidebar__title">PAYMENTS</h3>

                  <div class="sidebar__list">

                     <a href="/payment" class="sidebar__link {% if current_page == 'payment' %} active-link {% endif %}">
                        <i class="ri-receipt-fill"></i>
                        <span>Payments</span>
                     </a>
                  </div>
               </div>

            </div>

            <div class="sidebar__actions">
               <button>
                  <i class="ri-moon-clear-fill sidebar__link sidebar__theme" id="theme-button">
                     <span>Theme</span>
                  </i>
               </button>

               <button class="sidebar__link">
                  <i class="ri-logout-box-r-fill"></i>
                  <a href="/login_form">
                     <span>Log Out</span>
                  </a>
               </button>
            </div>
         </div>
      </nav>

      <!--=============== MAIN ===============-->
      <main class="main container" id="main"> 

            {% block content %}
            
            {% endblock %}

      </main>
      
      <!--=============== MAIN JS ===============-->
      <script src="{{ url_for('static', path='js/main.js') }}"></script>
      {% block scripts %}{% endblock %}
   </body>
</html>
