services:
  db:
    image: postgres
    container_name: db
    # restart: always
    environment:
      POSTGRES_USER: lyle
      POSTGRES_PASSWORD: lyle
      POSTGRES_DB: lyle
    ports:
      - "5432:5432"
    # volumes:
    #   - db_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      - db

  # web:
  #   build: .
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     - DB_USER=admin
  #     - DB_PASSWORD=secret
  #     - DB_NAME=test.db

volumes:
  db_data: